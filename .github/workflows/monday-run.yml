name: Septic listing agent — weekly run

on:
  schedule:
    # 13:00 UTC = 06:00 PDT (America/Los_Angeles, summer) / 05:00 PST (winter).
    # GitHub Actions cron doesn't support named timezones; this is off by 1 hour
    # in winter (Nov–Mar) — acceptable for a weekly listing alert.
    - cron: "0 13 * * 1"
  workflow_dispatch: # manual trigger from the Actions tab

permissions:
  contents: write # required to commit state/seen_listings.json + logs/ back to repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          LISTINGS_API_KEY: ${{ secrets.LISTINGS_API_KEY }}
          OWNER_API_KEY: ${{ secrets.OWNER_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # GitHub makes these available automatically; main.py uses them to
          # build the Actions run link in the email footer.
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python -m src.main --provider mock

      - name: Commit state and logs back to repo
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ logs/
          # Only commit when there are staged changes (first run always has changes;
          # subsequent runs update last_run_utc and the log file each time).
          git diff --staged --quiet \
            || git commit -m "chore: update state after weekly run [skip ci]"
          git push

      - name: Upload report artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: septic-report-${{ github.run_id }}
          path: out/
          retention-days: 7
